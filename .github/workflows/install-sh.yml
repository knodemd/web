name: install.sh

# Tests public/install.sh on Linux and macOS against a fake release.

on:
  push:
    branches: [main]
    paths: ["public/install.sh", "scripts/test-install.sh", ".github/workflows/install-sh.yml"]
  pull_request:
    paths: ["public/install.sh", "scripts/test-install.sh", ".github/workflows/install-sh.yml"]

permissions:
  contents: read

jobs:
  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install dash and wget
        if: runner.os == 'Linux'
        run: sudo apt-get update -q && sudo apt-get install -y --no-install-recommends dash wget shellcheck
      - name: Test
        run: sh scripts/test-install.sh
